  body::after{
    content:"";position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(ellipse 70% 55% at 50% 42%, rgba(11,15,26,.72), rgba(11,15,26,.25) 70%, transparent),
      linear-gradient(180deg, rgba(11,15,26,.15), rgba(11,15,26,.45));
  }
  html[lang="hi"] body{font-family:'Hind','Cairo',system-ui,sans-serif}

  /* ---------- Language toggle (top) ---------- */
  .lang-bar{width:100%;max-width:480px;display:flex;justify-content:center;margin-bottom:22px}
  .lang-toggle{
    display:inline-flex;gap:4px;padding:4px;border-radius:999px;
    background:rgba(20,26,43,.75);border:1px solid rgba(42,212,255,.25);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  .lang-toggle button{
    border:0;cursor:pointer;background:transparent;color:var(--muted);
    font:600 14px/1 'Cairo','Hind',sans-serif;padding:9px 16px;border-radius:999px;
    transition:background .2s,color .2s;
  }
  .lang-toggle button[data-lang="hi"]{font-family:'Hind',sans-serif}
  .lang-toggle button.active{background:linear-gradient(90deg,var(--brand2),var(--gold));color:#fff}

  /* ---------- Main ---------- */
  .wrap{width:100%;max-width:480px;text-align:center;display:flex;flex-direction:column;align-items:center}
  .logo{
    display:block;width:min(240px,64vw);height:auto;
    margin:6px auto 26px;
    filter:drop-shadow(0 6px 24px rgba(26,124,255,.45));
  }
  h1{text-shadow:0 2px 18px rgba(0,0,0,.6);font-size:30px;font-weight:800;line-height:1.3;margin-bottom:14px}
  h1 span{background:linear-gradient(90deg,#3aa0ff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{text-shadow:0 1px 10px rgba(0,0,0,.7);color:#cfd5e6;font-size:16px;line-height:1.75;margin-bottom:26px}

  .cta{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    width:100%;max-width:340px;padding:16px 22px;border-radius:14px;
    background:linear-gradient(180deg,var(--accent),var(--accent-dark));
    color:#fff;text-decoration:none;font-weight:800;font-size:18px;letter-spacing:.3px;
    box-shadow:0 10px 30px rgba(42,171,238,.35);
    animation:pulse 2s infinite;
  }
  .cta svg{width:22px;height:22px;flex:none}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(42,171,238,.55)}
    70%{box-shadow:0 0 0 16px rgba(42,171,238,0)}
    100%{box-shadow:0 0 0 0 rgba(42,171,238,0)}
  }

  .features{list-style:none;width:100%;margin:30px 0;display:grid;gap:12px}
  .features li{
    display:flex;align-items:center;gap:12px;text-align:start;
    background:rgba(20,26,43,.72);border:1px solid rgba(42,212,255,.18);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    border-radius:14px;padding:15px 16px;font-size:16px;font-weight:600;
  }
  .features .tick{
    flex:none;width:28px;height:28px;border-radius:50%;
    background:rgba(42,212,255,.14);color:var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;
  }

  footer{margin-top:28px;color:var(--muted);font-size:13px;line-height:1.8;text-align:center}
</style>
</head>
<body>

<!-- Language toggle -->
<div class="lang-bar">
  <div class="lang-toggle" role="group" aria-label="Language">
    <button type="button" data-lang="ar">العربية</button>
    <button type="button" data-lang="en">English</button>
    <button type="button" data-lang="hi">हिंदी</button>
  </div>
</div>
